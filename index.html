<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>ORBIT Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="login-box">

    <h1>ORBIT</h1>
    <p>Welcome Back</p>

    <input
    id="email"
    type="email"
    placeholder="Email">

    <input
    id="password"
    type="password"
    placeholder="Password">

    <button onclick="login()">
        SIGN IN
    </button>

    <button onclick="signup()">
CREATE ACCOUNT
</button>

</div>

<script type="module" src="script.js"></script>

</body>
</html>
